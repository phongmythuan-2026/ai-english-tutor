<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e9f7ff">
    <title>Teacher Emma - Gia sư tiếng Anh AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
            "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.3/modules/talkinghead.mjs"
        }
    }
    </script>
    <style>
        html, body { min-height: 100%; }
        #avatar-container canvas { display: block; }
        @media (max-width: 640px) {
            #kid-camera { width: 112px; height: 84px; right: 12px; bottom: 116px; }
        }
    </style>
</head>
<body class="min-h-screen overflow-hidden bg-gradient-to-b from-sky-100 via-blue-50 to-indigo-100 font-sans text-slate-800">
    <main class="relative flex min-h-screen flex-col items-center justify-center px-4 pb-28 pt-20">
        <header class="absolute left-0 right-0 top-0 z-10 flex items-center justify-between px-5 py-4 sm:px-8">
            <a href="/" class="text-lg font-extrabold tracking-tight text-indigo-900">🌈 English with Emma</a>
            <span class="rounded-full bg-white/80 px-3 py-1 text-xs font-semibold text-indigo-700 shadow-sm">AI English Class</span>
        </header>

        <section class="relative flex h-[min(70vh,680px)] w-full max-w-5xl flex-col items-center justify-center overflow-hidden rounded-[2rem] border border-white/70 bg-gradient-to-b from-sky-200 via-sky-100 to-indigo-200 shadow-xl shadow-indigo-900/10">
            <div class="pointer-events-none absolute left-10 top-12 text-5xl opacity-60" aria-hidden="true">☁️</div>
            <div class="pointer-events-none absolute right-12 top-24 text-4xl opacity-70" aria-hidden="true">✨</div>
            <div id="avatar-container" class="absolute inset-0"></div>
            <div id="avatar-fallback" class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-center">
                <div class="text-8xl drop-shadow-md" aria-hidden="true">👩‍🏫</div>
                <p class="font-bold text-indigo-900">Teacher Emma</p>
            </div>
            <div class="pointer-events-none absolute bottom-5 left-5 rounded-2xl bg-white/75 px-4 py-2 text-sm font-medium text-indigo-900 shadow-sm">
                <span aria-hidden="true">💬</span> Cùng Emma luyện nói tiếng Anh nhé!
            </div>
        </section>

        <div id="kid-camera" class="absolute bottom-32 right-8 z-10 h-36 w-48 overflow-hidden rounded-2xl border-4 border-white bg-slate-900 shadow-xl">
            <video id="kid-webcam" autoplay playsinline muted class="h-full w-full object-cover [transform:scaleX(-1)]"></video>
            <span class="absolute bottom-1 left-2 rounded bg-black/50 px-2 py-0.5 text-xs text-white">Con</span>
        </div>

        <div class="absolute bottom-4 left-1/2 z-20 flex w-[calc(100%-24px)] max-w-2xl -translate-x-1/2 flex-wrap items-center justify-center gap-2 rounded-2xl bg-white/90 p-3 shadow-xl backdrop-blur sm:bottom-6 sm:flex-nowrap sm:gap-3 sm:rounded-full sm:px-5">
            <p id="status-badge" role="status" aria-live="polite" class="w-full text-center text-xs font-semibold text-amber-700 sm:w-auto sm:min-w-36 sm:text-sm">Đang tải nhân vật 3D…</p>
            <button id="start-btn" disabled class="rounded-full bg-emerald-500 px-5 py-2.5 text-sm font-bold text-white shadow transition hover:bg-emerald-600 disabled:cursor-not-allowed disabled:bg-slate-300">
                📞 Bắt đầu gọi
            </button>
            <button id="end-btn" disabled class="hidden rounded-full bg-rose-500 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-rose-600 disabled:cursor-not-allowed disabled:bg-slate-300">
                Kết thúc
            </button>
            <button id="cam-btn" disabled class="rounded-full bg-indigo-100 px-4 py-2.5 text-sm font-semibold text-indigo-800 transition hover:bg-indigo-200 disabled:cursor-not-allowed disabled:opacity-50">
                📷 Tắt camera
            </button>
        </div>
    </main>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
